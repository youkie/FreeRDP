apply plugin: 'com.android.library'

android {
    compileSdkVersion = rootProject.ext.compileApi
    buildToolsVersion = rootProject.ext.toolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minApi
        targetSdkVersion rootProject.ext.targetApi
        ndkVersion = rootProject.ext.ndkVersion

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters rootProject.ext.abiFilters
        }
        externalNativeBuild {
            cmake {
                arguments rootProject.ext.cmakeArguments
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            externalNativeBuild {
                cmake {
                    arguments "-DWITH_OPUS=OFF"
                }
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DWITH_OPUS=OFF"
                }
            }
        }
        qa {
            externalNativeBuild {
                cmake {
                    abiFilters "arm64-v8a"
                    arguments "-DWITH_FFMPEG=OFF", "-DWITH_OPENH264=OFF",
                            "-DWITH_OPUS=OFF",   "-DWITH_WEBP=OFF",
                            "-DWITH_JPEG=OFF",   "-DWITH_PNG=OFF",
                            "-DWITH_CJSON=ON",  "-DWITH_OPENSSL=ON"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version rootProject.ext.cmakeVersion
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs', 'src/main/jniLibs']
        }
    }
}

/**
 * 修复版：copyNativeDeps
 * 遍历cmake构建输出目录下全部abi，将*.so复制到 src/main/jniLibs/$abi
 * Gradle正确写法：在task内部用project.copy()方法
 */
tasks.register("copyNativeDeps") {
    doLast {
        def buildTypeDir
        if (project.hasProperty("debug")) {
            buildTypeDir = "debug"
        } else if (project.hasProperty("release")) {
            buildTypeDir = "release"
        } else {
            // 兼容qa构建
            buildTypeDir = it.name.contains("qa") ? "qa" : "debug"
        }

        File cmakeObjRoot = file("build/intermediates/cmake/${buildTypeDir}/obj")
        if (!cmakeObjRoot.exists()) {
            logger.lifecycle("cmake obj dir not exist, skip copy: ${cmakeObjRoot.absolutePath}")
            return
        }

        cmakeObjRoot.listFiles().each { abiDir ->
            if (!abiDir.isDirectory()) return
            String abiName = abiDir.name
            File dstAbiDir = file("src/main/jniLibs/${abiName}")
            dstAbiDir.mkdirs()

            project.copy {
                from fileTree(abiDir).include("*.so")
                into dstAbiDir
            }
            logger.lifecycle("copy so: ${abiDir.absolutePath} -> ${dstAbiDir.absolutePath}")
        }
    }
}

// assemble* 系列任务前执行复制
tasks.named("assembleDebug") {
    dependsOn("copyNativeDeps")
}
tasks.named("assembleRelease") {
    dependsOn("copyNativeDeps")
}
tasks.named("assembleQa") {
    dependsOn("copyNativeDeps")
}

dependencies {
    implementation files('libs/sdk-release.aar')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    implementation "androidx.room:room-runtime:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"

    implementation 'net.zetetic:sqlcipher-android:4.17.0@aar'
    implementation 'androidx.sqlite:sqlite:2.7.0'
}