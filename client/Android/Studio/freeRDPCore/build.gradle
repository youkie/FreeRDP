apply plugin: 'com.android.library'

android {
    compileSdkVersion = rootProject.ext.compileApi
    buildToolsVersion = rootProject.ext.toolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minApi
        targetSdkVersion rootProject.ext.targetApi
        ndkVersion = rootProject.ext.ndkVersion

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters rootProject.ext.abiFilters
        }
        externalNativeBuild {
            cmake {
                arguments rootProject.ext.cmakeArguments
            }
        }
    }

    splits {
        abi {
            enable rootProject.ext.splitEnabled
            reset()
            include rootProject.ext.splitArchs
            universalApk rootProject.ext.universal
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            externalNativeBuild {
                cmake {
                    arguments "-DWITH_OPUS=OFF"
                }
            }
        }
        debug {
            jniDebuggable true
            externalNativeBuild {
                cmake {
                    arguments "-DWITH_OPUS=OFF"
                }
            }
        }
        qa {
            jniDebuggable false
            externalNativeBuild {
                cmake {
                    abiFilters "arm64-v8a"
                    arguments "-DWITH_FFMPEG=OFF", "-DWITH_OPENH264=OFF",
                            "-DWITH_OPUS=OFF",   "-DWITH_WEBP=OFF",
                            "-DWITH_JPEG=OFF",   "-DWITH_PNG=OFF",
                            "-DWITH_CJSON=ON",  "-DWITH_OPENSSL=ON"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version rootProject.ext.cmakeVersion
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs', 'src/main/jniLibs']
        }
    }
}


// CMake编译完成之后，把superbuild生成的所有第三方so复制进jniLibs
tasks.register("copyNativeDeps") {
    doLast {
        def abi = "arm64-v8a"
        def srcDir = file("build/intermediates/cmake/debug/obj/${abi}")
        def dstDir = file("src/main/jniLibs/${abi}")
        dstDir.mkdirs()
        // 把所有编译出来so全部复制到jniLibs
        fileTree(srcDir).include("*.so").each { soFile ->
            copy {
                from soFile
                into dstDir
            }
        }
    }
}

// assembleDebug 前执行 copyNativeDeps
tasks.named("assembleDebug") {
    dependsOn("copyNativeDeps")
}

// assembleRelease 前执行 copyNativeDeps
tasks.named("assembleRelease") {
    dependsOn("copyNativeDeps")
}

dependencies {
    implementation files('libs/sdk-release.aar')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    implementation "androidx.room:room-runtime:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"

    implementation 'net.zetetic:sqlcipher-android:4.17.0@aar'
    implementation 'androidx.sqlite:sqlite:2.7.0'
}


