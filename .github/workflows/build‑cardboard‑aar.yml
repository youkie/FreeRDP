name: Build Cardboard SDK AAR
on:
  workflow_dispatch: # 手动触发，在GitHub网页点运行
jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout source code v1.34.0
        uses: actions/checkout@v4
        with:
          repository: googlevr/cardboard
          ref: tags/v1.34.0  # 锁定版本1.34.0
          path: cardboard

      - name: Set up JDK 17
        uses: actions/setup‑java@v4
        with:
          java‑version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android‑actions/setup‑android‑sdk@v2
        with:
          api‑level: 33
          build‑tools‑version: "33.0.2"

      - name: Grant execute permission for gradlew
        working‑directory: ./cardboard
        run: chmod +x gradlew

      - name: Build sdk module assembleRelease（生成AAR）
        working‑directory: ./cardboard
        run: ./gradlew :sdk:assembleRelease

      - name: Upload AAR artifact
        uses: actions/upload‑artifact@v4
        with:
          name: cardboard‑sdk‑1.34.0‑aar
          path: cardboard/sdk/build/outputs/aar/sdk‑release.aar
